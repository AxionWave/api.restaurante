services:
  restaurante:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurante
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Jwt__Secret=${JWT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - ConnectionStrings__Default=Host=${DB_HOST:-postgres};Port=${DB_PORT:-5432};Database=${POSTGRES_DB:-base};Username=${DB_USERNAME:-postgres};Password=${DB_PASSWORD};Search Path=orion
      - Services__Core__BaseUrl=${SERVICES_CORE_BASE_URL:-http://core:8081}
      - Services__Core__InternalToken=${GATEWAY_INTERNAL_TOKEN}
      - Services__FiscalNfe__Provider=${FISCAL_NFE_PROVIDER:-none}
    restart: on-failure:5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - enterprisex-net

networks:
  enterprisex-net:
    external: true
    name: enterprisex-net
